[build]
  command = "python build_netlify.py"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Proxy /api requests to Netlify Python serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

# Return JSON 404 fallback if API endpoint is missing (never return HTML index.html for /api)
[[redirects]]
  from = "/api/*"
  to = "/api/404.json"
  status = 404

# Seamless handling for static path assets
[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 200

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
