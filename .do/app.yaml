name: calora-app
region: fra
services:
  - name: calora-web
    github:
      repo: kamauryan-lgtm/calora.ke
      branch: main
      deploy_on_push: true
    dockerfilePath: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
      period_seconds: 15
      timeout_seconds: 5
      failure_threshold: 3
    routes:
      - path: /
