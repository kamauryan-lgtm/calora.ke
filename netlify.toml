[build]
  command = "python build_netlify.py"
  publish = "dist"

# Dedicated health check response on static deployment
[[redirects]]
  from = "/api/health"
  to = "/static/api/health.json"
  status = 200

[[redirects]]
  from = "/api/health/"
  to = "/static/api/health.json"
  status = 200

# Guaranteed JSON 404 fallback (never return HTML for /api)
[[redirects]]
  from = "/api/*"
  to = "/static/api/404.json"
  status = 404
  force = true

# Seamless handling for static path assets
[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 200

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
